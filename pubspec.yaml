name: gleelight
description: A minimal Flutter app for local Yeelight control without cloud connection.
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: '>=3.6.0 <4.0.0'
  # Color.withValues, toARGB32 and CardThemeData need Flutter 3.27.
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true